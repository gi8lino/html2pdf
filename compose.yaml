services:
  html2pdf:
    build:
      context: .
      args:
        VERSION: ${HTML2PDF_BUILD_VERSION:-dev}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTML2PDF_TOKEN: ${HTML2PDF_TOKEN:-}
      HTML2PDF_WORKERS: ${HTML2PDF_WORKERS:-2}
      HTML2PDF_TIMEOUT: ${HTML2PDF_TIMEOUT:-45}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
