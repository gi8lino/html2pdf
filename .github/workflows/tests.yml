name: Tests

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t html2pdf:test .

      - name: Run unit tests
        run: |
          docker run --rm \
            --entrypoint python3 \
            -v "$PWD/test_app.py:/app/test_app.py:ro" \
            html2pdf:test \
            -m unittest -v test_app
